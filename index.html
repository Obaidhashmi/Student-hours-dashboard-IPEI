<style>

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif;display:flex;min-height:100vh}

aside button.nav:hover{background:#ffffff14}aside button.nav.on{background:#ffffff26;color:#fff;font-weight:500}.kan{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}.col{background:var(--bg);border:1px solid var(--line);border-radius:10px;min-width:230px;width:230px;padding:10px;min-height:220px;flex-shrink:0}.ch{display:flex;justify-content:space-between;margin-bottom:8px}.kc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab;font-size:14px}

.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}

.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.tools input{max-width:260px}.tools select{width:auto}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}

.mut{color:var(--mut);font-size:13px}.empty{padding:36px;text-align:center;color:var(--mut)}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.show{display:flex}.box{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.box h3{margin:0 0 14px}.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{font-size:13px;color:var(--mut);display:block}.f .full{grid-column:1/-1}
.act{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.menu{display:none}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px;padding:10px}aside h1,aside small{display:none}aside button.nav{width:auto;padding:7px 10px}main{padding:16px}.two{grid-template-columns:1fr}.f{grid-template-columns:1fr}}
.pill{display:inline-block;padding:2px 10px;border-radius:5px;font-weight:700;color:#fff;font-size:13px}.kc b{color:var(--acc)}.kc div{margin-top:4px}.kf{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:13px}.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.dg h3{margin:0 0 8px;color:var(--acc);font-size:16px}.vb{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:8px}.vb div{flex:1;text-align:center;font-size:12px}.vb i{display:block;border-radius:4px 4px 0 0;margin-bottom:4px}.pre{display:flex;gap:8px;flex-wrap:wrap}input[type=color]{height:38px;padding:2px}
.sel{border-color:var(--acc);color:var(--acc);font-weight:700}.srow{display:grid;grid-template-columns:170px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.srow label.btn{display:inline-block}@media(max-width:820px){.srow{grid-template-columns:1fr}}

<script>

const CO=['Nova Tech','Bilal Corp','Studio IO','Shop PK','Brand Co','Firm PK','Agency PK','Startup Inc'],AM=[1200,800,2500,400,3000,600,5000,900];
const CATS={'Reliability & Quality':['CMRP','CRE','CRL','Six Sigma Black Belt'],'Industrial Automation':['ASE','PMT'],'ETAP Family':['ETAP','ETAP Advance','Power System Protection with ETAP'],'Power Equipment':['Substation Design','Transformer Life Cycle Maintenance'],'Power Systems Software':['DIgSILENT PowerFactory','HVDC','PSCAD','PLS-CADD','PSS/E'],'Primavera':['Primavera P6'],'Cyber Security':['Cyber Security','OT & Industrial Cyber Security']};

const ALI=[[/power system protection/i,'Power System Protection with ETAP'],[/etap\s*advance/i,'ETAP Advance'],[/\betap\b/i,'ETAP'],[/\bcmrp\b|certified maintenance/i,'CMRP'],[/\bcre\b|certified reliability engineer/i,'CRE'],[/\bcrl\b|reliability leader/i,'CRL'],[/six\s*sigma/i,'Six Sigma Black Belt'],[/\base\b|automation system engineer/i,'ASE'],[/\bpmt\b/i,'PMT'],[/substation/i,'Substation Design'],[/transformer/i,'Transformer Life Cycle Maintenance'],[/digsilent|power\s*factory/i,'DIgSILENT PowerFactory'],[/\bhvdc\b/i,'HVDC'],[/\bpscad\b/i,'PSCAD'],[/pls[-\s]?cadd/i,'PLS-CADD'],[/\bpss\/?e\b/i,'PSS/E'],[/primavera|\bp6\b/i,'Primavera P6'],[/\bot\b.{0,25}(cyber|industrial)|industrial\s*cyber|certification in ot\b/i,'OT & Industrial Cyber Security'],[/cyber\s*security|cybersecurity|\bcyber\b/i,'Cyber Security']];
const pd=t=>{const m=String(t||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]).getTime():0};
const xv=(o,sub)=>{o=o||{};const k=Object.keys(o).find(x=>x.toLowerCase().includes(sub));return k?o[k]:''};
function courseOf(r,k){const m=t=>{t=String(t||'');for(const a of ALI)if(a[0].test(t))return a[1];return ''};const c=k>=0?String(r[k]||'').trim():'';return m(c)||m(r.join(' '))||((c.length>2&&!/^(yes|no|true|false|n\/a)$/i.test(c))?c:'')}
const usd=n=>'PKR '+Number(n||0).toLocaleString();
const PRE=[['#0b5f58','#2b3a47','#ff7a59','HubSpot'],['#5b3fd1','#231b3d','#8b6cf0','Purple'],['#1f6feb','#0f2540','#3aa0ff','Blue'],['#c2410c','#2a1d16','#f59e0b','Sunset']];
const WN=[['stats','Key numbers'],['newc','New contacts'],['time','Contacts over time'],['sources','Contact sources'],['stages','Deals by stage'],['course','Leads by course'],['applicant','Applicant type'],['exp','Experience'],['step','Current step']];
let leads=[],view='dashboard',filt={q:'',src:'',temp:'',stage:''};
const seed=()=>[
['Ayesha Khan','+92 300 1234567','ayesha@mail.com','Meta','Hot','Qualified','Asked for pricing on the premium package'],
['Bilal Ahmed','+92 321 7654321','bilal@corp.pk','WhatsApp','Hot','Contacted','Wants a demo this week'],
['Sara Malik','sara@studio.io','sara@studio.io','LinkedIn','Warm','New','Connected after webinar'],
['Usman Tariq','+92 333 9988776','usman@shop.pk','Instagram','Cold','New','Replied to story, no follow up yet'],
['Hina Raza','+92 345 1122334','hina@brand.com','Facebook','Warm','Proposal','Proposal sent, waiting on approval'],
['Ali Hassan','+92 302 5566778','ali@firm.pk','Meta','Cold','Lost','Budget too low'],
['Noor Fatima','+92 311 4433221','noor@agency.pk','WhatsApp','Hot','Won','Signed 6-month plan'],
['Zain Abbas','zain@startup.com','zain@startup.com','Website','Warm','Contacted','Filled contact form']
].map((a,i)=>({id:'s'+i,name:a[0],phone:a[1],email:a[2],source:a[3],temp:a[4],stage:a[5],notes:a[6],created:Date.now()-i*864e5*1.5,company:CO[i],amount:AM[i],close:''}));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}};leads=ld('leaddesk2',seed());let tasks=ld('ld_t',[{id:'t1',title:'Call Bilal about the demo',due:'',done:false},{id:'t2',title:'Send proposal to Hina',due:'',done:false}]),log=ld('ld_l',[]),users=ld('ld_u',[]),delk=ld('ld_x',[]),me=(()=>{try{return JSON.parse(sessionStorage.getItem('ld_me')||'null')}catch(e){return null}})(),sheets=ld('ld_s',{}),theme=ld('ld_th',{acc:'#0b5f58',side:'#2b3a47',chart:'#ff7a59',hide:[]});
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};const save=()=>{sv('leaddesk2',leads);sv('ld_t',tasks);sv('ld_l',log)};const saveT=()=>sv('ld_th',theme);const applyTheme=()=>{const e=document.documentElement;if(theme.mode&&theme.mode!=='system')e.dataset.theme=theme.mode;else delete e.dataset.theme;const z=e.style;z.setProperty('--acc',theme.acc);z.setProperty('--side',theme.side);z.setProperty('--chart',theme.chart)};const plog=x=>{log.unshift({t:Date.now(),x});log=log.slice(0,60)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fmt=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});

function nav(v,extra){sel.clear();view=v;filt={q:'',src:'',temp:'',stage:'',...extra};render()}
function side(){
 const n=(v,label,x,dot)=>`<button class="nav ${view===v&&JSON.stringify(x||{})===JSON.stringify(cur)?'on':''}" onclick='nav("${v}",${JSON.stringify(x||{})})'>${dot?`<span class="dot" style="background:${dot}"></span>`:''}${label}</button>`;
 $('side').innerHTML=`<h1>LeadDesk</h1>${n('dashboard','Dashboard')}${n('contacts','Contacts')}${n('sheetdata','Sheet data')}${isA()?n('companies','Companies'):''}${n('pipeline','Deals')}${n('tasks','Tasks')}${n('feed','Activity feed')}
 <small>Lead temperature</small>${n('contacts','Hot leads',{temp:'Hot'},'var(--hot)')}${n('contacts','Warm leads',{temp:'Warm'},'var(--warm)')}${n('contacts','Cold leads',{temp:'Cold'},'var(--cold)')}
 <small>Sources</small>${Object.keys(SRC).map(s=>n('contacts',s,{src:s},SRC[s])).join('')}${isA()?'<small>Workspace</small>'+n('settings','Settings')+n('users','Users'):''}<small>Signed in: ${esc(me.name)}</small><button class="nav" onclick="logout()">Log out</button>`}
let cur={};
function render(){if(!me)return;if(!isA()&&['settings','users','companies'].includes(view))view='dashboard';cur={};if(view==='contacts'){['q','src','temp','stage'].forEach(k=>{if(filt[k]&&k!=='q')cur[k]=filt[k]})}side();({dashboard:dash,pipeline:pipe,companies:comp,tasks:tasksV,feed:feedV,settings:setV,sheetdata:sheetV,users:usersV}[view]||list)()}

function dash(){const leads=vis();
 const c=f=>leads.filter(f).length,tot=leads.length,won=c(l=>l.stage==='Won');
 const n=new Date(),m0=new Date(n.getFullYear(),n.getMonth(),1).getTime(),p0=new Date(n.getFullYear(),n.getMonth()-1,1).getTime();
 const nm=c(l=>l.created>=m0),pm=c(l=>l.created>=p0&&l.created<m0);
 const open=leads.filter(l=>l.stage!=='Won'&&l.stage!=='Lost').reduce((a,l)=>a+(+l.amount||0),0);
 const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-13+i);return d.getTime()});
 const cnt=days.map(t=>leads.filter(l=>l.created>=t&&l.created<t+864e5).length),mx=Math.max(1,...cnt);
 const xy=cnt.map((v,i)=>[10+i*280/13,90-v/mx*75]);
 const smx=Math.max(1,...Object.keys(SRC).map(x=>c(l=>l.source===x)));
 const st=(v,t,col)=>`<div class="card stat"><b ${col?`style="color:${col}"`:''}>${v}</b><span>${t}</span></div>`;
 const W={
 stats:`<div class="grid" style="grid-column:1/-1;margin:0">${st(tot,'Total leads')}${st(c(l=>l.temp==='Hot'),'Hot leads','var(--hot)')}${st(usd(open),'Open deal value')}${st(tot?Math.round(won/tot*100)+'%':'0%','Win rate')}${st(tasks.filter(t=>!t.done).length,'Open tasks')}${st(c(l=>/^y/i.test(xv(l.extra,'price'))),'Price confirmed','var(--acc)')}${st(c(l=>/^y/i.test(xv(l.extra,'csr'))),'CSR requested')}</div>`,
 newc:`<div class="card"><h3>New contacts created</h3><div class="mut">This month, compared to last month (${pm})</div><b style="font-size:44px;color:var(--acc)">${nm}</b></div>`,
 time:`<div class="card"><h3>Contacts added over time</h3><div class="mut">Last 14 days</div><svg viewBox="0 0 300 100" style="width:100%"><polyline fill="none" stroke="var(--chart)" stroke-width="2.5" points="${xy.map(p=>p.join(',')).join(' ')}"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--chart)"/>`).join('')}</svg></div>`,
 sources:`<div class="card"><h3>Contact sources</h3><div class="vb">${Object.keys(SRC).map(x=>{const k=c(l=>l.source===x);return `<div><i style="height:${k/smx*110+2}px;background:${SRC[x]}"></i>${k}<br>${x}</div>`}).join('')}</div></div>`,
 stages:`<div class="card"><h3>Deals by stage</h3>${STAGES.map(x=>{const r=leads.filter(l=>l.stage===x);return `<div class="bar"><span class="pill" style="background:${SC[x]};width:92px;text-align:center">${x}</span><i style="width:${r.length/Math.max(1,tot)*45}%;background:${SC[x]}"></i><em>${r.length}, ${usd(r.reduce((a,l)=>a+(+l.amount||0),0))}</em></div>`}).join('')}</div>`};
 const bw=(t,fn)=>{const cc={};leads.forEach(l=>{const k=fn(l)||'Not set';cc[k]=(cc[k]||0)+1});const cs=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,8),m=Math.max(1,...cs.map(x=>x[1]));return `<div class="card"><h3>${t}</h3>${cs.map(x=>`<div class="bar"><span style="width:150px;font-size:13px">${esc(x[0])}</span><i style="width:${x[1]/m*35}%;background:var(--chart)"></i><em>${x[1]}</em></div>`).join('')}</div>`};
 W.course=bw('Leads by course',l=>l.course);W.applicant=bw('Applicant type',l=>xv(l.extra,'applicant'));W.exp=bw('Experience',l=>xv(l.extra,'experience'));W.step=bw('Current step',l=>xv(l.extra,'current step'));
 $('main').innerHTML=`<div class="top"><h2>CRM overview</h2><div><button class="btn ghost" onclick="tgl()">${dark()?'Light mode':'Dark mode'}</button> <button class="btn" onclick="edit()">Add lead</button></div></div><div class="dg">${Object.keys(W).filter(k=>!theme.hide.includes(k)).map(k=>W[k]).join('')}</div>`}
function custom(){
 $('box').innerHTML=`<h3>Customize dashboard</h3><div class="f"><div><label>Buttons and accent</label><input type="color" value="${theme.acc}" oninput="th('acc',this.value)"></div><div><label>Sidebar</label><input type="color" value="${theme.side}" oninput="th('side',this.value)"></div><div><label>Chart color</label><input type="color" value="${theme.chart}" oninput="th('chart',this.value)"></div><div></div>

 const m=theme.mode||'system',lbl='style="color:var(--ink);display:block"';
 const col=(k,t)=>`<div><label>${t}</label><input type="color" value="${theme[k]}" oninput="th('${k}',this.value)"></div>`;
 $('main').innerHTML=`<div class="top"><h2>Settings</h2></div>
 <div class="card" style="margin-bottom:14px"><h3 style="margin-top:0">Appearance</h3><div class="pre" style="margin-bottom:14px">${['light','dark','system'].map(x=>`<button class="btn ghost ${m===x?'sel':''}" onclick="md('${x}')">${x[0].toUpperCase()+x.slice(1)} mode</button>`).join('')}</div>
 <div class="f">${col('acc','Buttons and accent')}${col('side','Sidebar')}${col('chart','Chart color')}<div></div>

function parseCSV(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}else if(h==='"')q=true;else if(h===','){r.push(c);c=''}else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(y=>y.trim()))}

  const crs=courseOf(r,I.k),xt={},dt=pd(g(r,'d')),amt=+g(r,'a').replace(/[^\d.]/g,'')||0;hd.forEach((c,i)=>{const v=String(r[i]||'').trim();if(v)xt[String(c).trim()]=v});

function list(){const leads=vis();
 const q=filt.q.toLowerCase();
 const rows=leads.filter(l=>(!filt.src||l.source===filt.src)&&(!filt.course||l.course===filt.course)&&(!filt.temp||l.temp===filt.temp)&&(!filt.stage||l.stage===filt.stage)&&(!q||[l.name,l.phone,l.email,l.notes].join(' ').toLowerCase().includes(q)));
 const title=filt.temp?filt.temp+' leads':filt.src?filt.src+' leads':'Contacts';
 const sel=(k,arr,ph)=>`<select onchange="filt.${k}=this.value;list()"><option value="">${ph}</option>${arr.map(a=>`<option ${filt[k]===a?'selected':''}>${a}</option>`).join('')}</select>`;
 $('main').innerHTML=`<div class="top"><h2>${title} <span class="mut">(${rows.length})</span></h2><div>${isA()?'<button class="btn ghost" id="bd" style="display:none;color:var(--hot)" onclick="delSel()">Delete selected (0)</button> <button class="btn ghost" style="color:var(--hot)" onclick="delAll()">Delete all shown</button> <button class="btn ghost" onclick="csv()">Export CSV</button> ':''}<button class="btn" onclick="edit()">Add lead</button></div></div>
 <div class="tools"><input id="q" placeholder="Search name, phone, email" value="${esc(filt.q)}" oninput="filt.q=this.value;body()">${sel('src',Object.keys(SRC),'All sources')}${sel('temp',TEMPS,'All temperatures')}${sel('stage',STAGES,'All stages')}${sel('course',isA()?COURSES:me.courses,'All courses')}</div>
 <div class="card wrap" style="padding:0" id="tb"></div>`;body();updBulk()}
function body(){const leads=vis();
 const q=filt.q.toLowerCase();
 const rows=leads.filter(l=>(!filt.src||l.source===filt.src)&&(!filt.course||l.course===filt.course)&&(!filt.temp||l.temp===filt.temp)&&(!filt.stage||l.stage===filt.stage)&&(!q||[l.name,l.phone,l.email,l.notes].join(' ').toLowerCase().includes(q)));
 shown=rows;$('tb').innerHTML=rows.length?`<table><tr>${isA()?`<th style="width:30px"><input type="checkbox" style="width:auto" ${shown.length&&shown.every(l=>sel.has(l.id))?'checked':''} onchange="tall(this.checked)"></th>`:''}<th>Name</th><th>Contact</th><th>Course</th><th>Source</th><th>Temperature</th><th>Stage</th><th>Added</th></tr>${rows.map(l=>`<tr class="r" onclick="edit('${l.id}')">${isA()?`<td onclick="event.stopPropagation()"><input type="checkbox" style="width:auto" ${sel.has(l.id)?'checked':''} onchange="tsel('${l.id}',this.checked)"></td>`:''}<td><b>${esc(l.name)}</b><div class="mut">${esc(l.company||l.notes).slice(0,48)}</div></td><td>${esc(l.phone)}<div class="mut">${esc(l.email)}</div></td><td>${esc(l.course)||'<span class="mut">Not set</span>'}<div class="mut">${esc([xv(l.extra,'applicant'),xv(l.extra,'experience')].filter(x=>x).join(', '))}</div></td><td><span class="dot" style="background:${SRC[l.source]}"></span> ${l.source}</td><td><span class="tag t-${l.temp}">${l.temp}</span></td><td>${l.stage}</td><td class="mut">${fmt(l.created)}</td></tr>`).join('')}</table>`:'<div class="empty">No leads match these filters. Clear a filter or add a new lead.</div>'}

function edit(id){
 const l=leads.find(x=>x.id===id)||{name:'',phone:'',email:'',source:'Meta',temp:'Warm',stage:'New',notes:'',company:'',amount:0,close:'',course:''};
 const o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
 $('box').innerHTML=`<h3>${id?'Edit lead':'Add lead'}</h3><div class="f">
 <div class="full"><label>Name</label><input id="fn" value="${esc(l.name)}"></div>
 <div><label>Phone / WhatsApp</label><input id="fp" value="${esc(l.phone)}"></div><div><label>Email</label><input id="fe" value="${esc(l.email)}"></div>
 <div><label>Source</label><select id="fs">${o(Object.keys(SRC),l.source)}</select></div><div><label>Temperature</label><select id="ft">${o(TEMPS,l.temp)}</select></div>
 <div class="full"><label>Stage</label><select id="fg">${o(STAGES,l.stage)}</select></div>
 <div class="full"><label>Course</label><select id="fu"><option value="">Not set</option>${l.course&&!COURSES.includes(l.course)?`<option selected>${esc(l.course)}</option>`:''}${(isA()?COURSES:me.courses).map(c=>`<option ${c===l.course?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Company</label><input id="fc" value="${esc(l.company)}"></div><div><label>Deal amount (PKR)</label><input id="fa" type="number" value="${l.amount||0}"></div><div class="full"><label>Expected close date</label><input id="fd" type="date" value="${l.close||''}"></div>${l.extra?`<div class="full"><label>Sheet details</label><div style="color:var(--ink);font-size:14px">${Object.entries(l.extra).map(e=>esc(e[0])+': '+esc(e[1])).join('<br>')}</div></div>`:''}<div class="full"><label>Notes</label><textarea id="fo" rows="3">${esc(l.notes)}</textarea></div></div>
 <div class="act"><div>${id&&isA()?`<button class="btn del" onclick="del('${id}')">Delete</button>`:''}</div><div><button class="btn ghost" onclick="closeM()">Cancel</button> <button class="btn" onclick="saveLead('${id||''}')">Save lead</button></div></div>`;
 $('modal').classList.add('show');$('fn').focus()}
function closeM(){$('modal').classList.remove('show')}
function saveLead(id){
 const name=$('fn').value.trim();if(!name){$('fn').style.borderColor='var(--hot)';return}
 const d={name,phone:$('fp').value,email:$('fe').value,source:$('fs').value,temp:$('ft').value,stage:$('fg').value,notes:$('fo').value,company:$('fc').value,course:$('fu').value||(isA()?'':(me.courses[0]||'')),amount:+$('fa').value||0,close:$('fd').value};
 if(id)Object.assign(leads.find(x=>x.id===id),d);else leads.unshift({id:'l'+Date.now(),created:Date.now(),...d});plog((id?'Updated ':'Added ')+name);
 save();closeM();render()}
function del(id){if(confirm('Delete this lead?')){delLeads([id]);closeM()}}
function csv(){
 const h=['name','phone','email','source','course','temp','stage','company','amount','notes'];
 const t=[h.join(',')].concat(leads.map(l=>h.map(k=>'"'+String(l[k]).replace(/"/g,'""')+'"').join(','))).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='leads.csv';a.click()}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
boot();
</script></body></html>
